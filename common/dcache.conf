dcache.enable.space-reservation = false
dcache.enable.kafka = false

dcache.zookeeper.connection = zk:2181

dcache.layout = docker-layout

dcache.broker.core.client.channel.security = tls
dcache.broker.satellite.channel.security = tls
dcache.broker.channel.require-client-auth = true

dcache.authn.crl-mode = IF_VALID