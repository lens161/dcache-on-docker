# Federated dCache poolmanager - classic netunit/link approach
#
# Three sites sharing a single namespace:
#   DESY        131.169.0.0/16
#   Goettingen  134.76.0.0/16
#   Wuppertal   132.195.0.0/16
#
# Locality policy:
#   Writes land on pools local to the door's site (writepref=30).
#   Reads prefer local pools (readpref=30) and fall back to any pool
#   across all sites (readpref=10) when the file is not cached locally.

# ---------------------------------------------------------------------------
# Net units
# ---------------------------------------------------------------------------

psu create unit -net 0.0.0.0/0.0.0.0
psu create unit -net ::/0
psu create unit -net 131.169.0.0/16
psu create unit -net 134.76.0.0/16
psu create unit -net 132.195.0.0/16

psu create unit -protocol */*
psu create unit -store *@*

# ---------------------------------------------------------------------------
# Unit groups
# ---------------------------------------------------------------------------

psu create ugroup world-net
psu addto ugroup world-net 0.0.0.0/0.0.0.0
psu addto ugroup world-net ::/0
psu addto ugroup world-net 131.169.0.0/16
psu addto ugroup world-net 134.76.0.0/16
psu addto ugroup world-net 132.195.0.0/16

psu create ugroup desy-net
psu addto ugroup desy-net 131.169.0.0/16

psu create ugroup goettingen-net
psu addto ugroup goettingen-net 134.76.0.0/16

psu create ugroup wuppertal-net
psu addto ugroup wuppertal-net 132.195.0.0/16

psu create ugroup any-protocol
psu addto ugroup any-protocol */*

psu create ugroup any-store
psu addto ugroup any-store *@*

# ---------------------------------------------------------------------------
# Pools (static - each pool must be declared and assigned explicitly)
# ---------------------------------------------------------------------------

psu create pool desy-pool-1
psu create pool desy-pool-2
psu create pool desy-pool-3

psu create pool goettingen-pool-1
psu create pool goettingen-pool-2

psu create pool wuppertal-pool-1
psu create pool wuppertal-pool-2

# ---------------------------------------------------------------------------
# Pool groups
# ---------------------------------------------------------------------------

psu create pgroup desy-pools
psu addto pgroup desy-pools desy-pool-1
psu addto pgroup desy-pools desy-pool-2
psu addto pgroup desy-pools desy-pool-3

psu create pgroup goettingen-pools
psu addto pgroup goettingen-pools goettingen-pool-1
psu addto pgroup goettingen-pools goettingen-pool-2

psu create pgroup wuppertal-pools
psu addto pgroup wuppertal-pools wuppertal-pool-1
psu addto pgroup wuppertal-pools wuppertal-pool-2

psu create pgroup all-pools
psu addto pgroup all-pools desy-pool-1
psu addto pgroup all-pools desy-pool-2
psu addto pgroup all-pools desy-pool-3
psu addto pgroup all-pools goettingen-pool-1
psu addto pgroup all-pools goettingen-pool-2
psu addto pgroup all-pools wuppertal-pool-1
psu addto pgroup all-pools wuppertal-pool-2

# ---------------------------------------------------------------------------
# Links - writes (prefer local site, writepref=30)
# ---------------------------------------------------------------------------

psu create link desy-write desy-net any-store any-protocol
psu set link desy-write -writepref=30 -readpref=0 -cachepref=0 -p2ppref=0
psu addto link desy-write desy-pools

psu create link goettingen-write goettingen-net any-store any-protocol
psu set link goettingen-write -writepref=30 -readpref=0 -cachepref=0 -p2ppref=0
psu addto link goettingen-write goettingen-pools

psu create link wuppertal-write wuppertal-net any-store any-protocol
psu set link wuppertal-write -writepref=30 -readpref=0 -cachepref=0 -p2ppref=0
psu addto link wuppertal-write wuppertal-pools

# Fallback: unknown subnets write to any pool
psu create link fallback-write world-net any-store any-protocol
psu set link fallback-write -writepref=10 -readpref=0 -cachepref=0 -p2ppref=0
psu addto link fallback-write all-pools

# ---------------------------------------------------------------------------
# Links - reads (prefer local site readpref=30; global fallback readpref=10)
# ---------------------------------------------------------------------------

psu create link desy-read desy-net any-store any-protocol
psu set link desy-read -writepref=0 -readpref=30 -cachepref=30 -p2ppref=30
psu addto link desy-read desy-pools

psu create link goettingen-read goettingen-net any-store any-protocol
psu set link goettingen-read -writepref=0 -readpref=30 -cachepref=30 -p2ppref=30
psu addto link goettingen-read goettingen-pools

psu create link wuppertal-read wuppertal-net any-store any-protocol
psu set link wuppertal-read -writepref=0 -readpref=30 -cachepref=30 -p2ppref=30
psu addto link wuppertal-read wuppertal-pools

# Global fallback: any client can read from any pool
psu create link global-read world-net any-store any-protocol
psu set link global-read -writepref=0 -readpref=10 -cachepref=10 -p2ppref=10
psu addto link global-read all-pools
