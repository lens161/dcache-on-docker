# Zone-aware pool manager setup.
#
# Writes: a single catch-all link exposes all pools (by attaching all zone
#         pool groups) so that the zone filter in PoolMonitorV5 can pick the
#         pool matching the door's zone.
#
# Reads:  network-specific links prefer pools in the client's zone first,
#         falling back to all pools if the file isn't found locally.
#
# Note: a tagless "-dynamic" pool group is always empty (addIfMatches never
#       fires when tags is empty), so we attach the zone groups directly to
#       the write link instead.

# units

psu create unit -net 0.0.0.0/0.0.0.0
psu create unit -protocol */*
psu create unit -store *@*

psu create unit -net 172.18.0.0/16 -zone=main
psu create unit -net 10.2.0.0/16 -zone=remote
psu create unit -net 11.2.0.0/16 -zone=remote-2

# unit groups

psu create ugroup all-net
psu addto ugroup all-net 0.0.0.0/0.0.0.0
psu addto ugroup all-net 10.2.0.0/16
psu addto ugroup all-net 11.2.0.0/16
psu addto ugroup all-net 172.18.0.0/16

psu create ugroup remote-net
psu addto ugroup remote-net 10.2.0.0/16

psu create ugroup remote-2-net
psu addto ugroup remote-2-net 11.2.0.0/16

psu create ugroup main-net
psu addto ugroup main-net 172.18.0.0/16

psu create ugroup any-protocol
psu addto ugroup any-protocol */*

psu create ugroup any-store
psu addto ugroup any-store *@*

# pool groups (pools join dynamically based on zone tag)

psu create pgroup main-pools -dynamic -tags=zone=main
psu create pgroup remote-pools -dynamic -tags=zone=remote
psu create pgroup remote-2-pools -dynamic -tags=zone=remote-2

# links

# catch all link to verify zone filetering is working when pools with multiple zones are in link
psu create link write-link all-net any-protocol any-store
psu set link write-link -writepref=10 -readpref=0 -cachepref=0 -p2ppref=0
psu addto link write-link main-pools
psu addto link write-link remote-pools
psu addto link write-link remote-2-pools

# Reads: prefer pools in the client's network zone, fall back to all pools.
# psu create link main-read-link main-net any-protocol any-store
# psu set link main-read-link -writepref=0 -readpref=20 -cachepref=20 -p2ppref=20
# psu addto link main-read-link main-pools

# psu create link remote-read-link remote-net any-protocol any-store
# psu set link remote-read-link -writepref=0 -readpref=20 -cachepref=20 -p2ppref=20
# psu addto link remote-read-link remote-pools

psu create link default-link all-net any-protocol any-store
psu set link default-link -writepref=0 -readpref=10 -cachepref=10 -p2ppref=10
psu addto link default-link main-pools
psu addto link default-link remote-pools
psu addto link default-link remote-2-pools