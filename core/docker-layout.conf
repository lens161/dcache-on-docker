chimera.db.user=postgres
chimera.db.password=let-me-in
chimera.db.host=pg
chimera.db.name=chimera

[core]
dcache.broker.scheme = core
dcache.zone = main

[core/admin]

[core/poolmanager]
poolmanager.setup.file=/opt/dcache/etc/poolmanager.conf

[core/pnfsmanager]
chimera.db.url=jdbc:postgresql://${chimera.db.host}/${chimera.db.name}?ApplicationName=${pnfsmanager.cell.name}

[core/cleaner-disk]
chimera.db.url=jdbc:postgresql://${chimera.db.host}/${chimera.db.name}?ApplicationName=cleaner-disk

[core/gplazma]
# DESY dev Keycloak
gplazma.oidc.provider!DESY = https://keycloak.desy.de/auth/realms/dcache-dev -profile=oidc
gplazma.oidc.audience-targets = 1234
# local Keycloak (../keycloak):
# gplazma.oidc.provider!KEYCLOAK = http://keycloak:8085/realms/dcache-test -profile=oidc
# gplazma.oidc.audience-targets = dcache-view

[core/httpd]

[core/webdav]
webdav.net.port=8080
webdav.authz.anonymous-operations=FULL
webdav.authn.basic=true
webdav.redirect.on-write=false
webdav.redirect.on-read=false

# [core/nfs]
# nfs.version=4.1
# nfs.export.file=/opt/dcache/etc/exports

[core/frontend]
frontend.authn.protocol=http
frontend.authn.basic=true
frontend.authz.anonymous-operations=FULL
frontend.authz.unlimited-operation-visibility=true
# OIDC code flow: DESY dev Keycloak
frontend.authn.oidc.client-id=1234
frontend.authn.oidc.client-secret=OSwvvbbF26vioqGkeKVXy4IV7QHFbmUv
frontend.authn.oidc.issuer=https://keycloak.desy.de/auth/realms/dcache-dev
frontend.static!dcache-view.oidc-provider-name-list=Helmholtz%20AAI(Keycloak)
frontend.static!dcache-view.oidc-client-id-list=1234
frontend.static!dcache-view.oidc-issuer-list=https://keycloak.desy.de/auth/realms/dcache-dev
# unknown IdP hint -> Keycloak skips the desy-sso redirector and shows its own
# login form, so local realm (test) accounts can sign in. Dev only.
frontend.static!dcache-view.oidc-authz-endpoint-extra=kc_idp_hint=none
# OIDC code flow: local Keycloak (../keycloak)
# frontend.authn.oidc.client-id=dcache-view
# frontend.authn.oidc.client-secret=dcache-view-dev-secret
# frontend.authn.oidc.issuer=http://keycloak:8085/realms/dcache-test
# frontend.static!dcache-view.oidc-provider-name-list=Keycloak
# frontend.static!dcache-view.oidc-client-id-list=dcache-view
# frontend.static!dcache-view.oidc-issuer-list=http://keycloak:8085/realms/dcache-test

[core/billing]
billing.text.dir=/var/log/dcache/billing
