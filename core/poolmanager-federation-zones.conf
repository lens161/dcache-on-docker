# Federated dCache poolmanager - zone-aware approach
#
# Same three-site scenario as poolmanager-federation-classic.conf, but
# net units carry a -zone annotation and pool groups are dynamic.
# PoolMonitorV5 zone-filters candidate pools automatically, so a single
# write link and a single read link replace the per-site link pairs.
# Adding a fourth site costs two lines (one unit, one pgroup) instead of
# a new ugroup plus two new links.

# ---------------------------------------------------------------------------
# Units
# ---------------------------------------------------------------------------

psu create unit -net 0.0.0.0/0.0.0.0
psu create unit -net ::/0
psu create unit -protocol */*
psu create unit -store *@*

psu create unit -net 131.169.0.0/16 -zone=desy
psu create unit -net 134.76.0.0/16  -zone=goettingen
psu create unit -net 132.195.0.0/16 -zone=wuppertal

# ---------------------------------------------------------------------------
# Unit groups
# ---------------------------------------------------------------------------

psu create ugroup world-net
psu addto ugroup world-net 0.0.0.0/0.0.0.0
psu addto ugroup world-net ::/0
psu addto ugroup world-net 131.169.0.0/16
psu addto ugroup world-net 134.76.0.0/16
psu addto ugroup world-net 132.195.0.0/16

psu create ugroup any-protocol
psu addto ugroup any-protocol */*

psu create ugroup any-store
psu addto ugroup any-store *@*

# ---------------------------------------------------------------------------
# Pool groups (dynamic - pools join automatically via their zone tag)
# ---------------------------------------------------------------------------

psu create pgroup desy-pools       -dynamic -tags=zone=desy
psu create pgroup goettingen-pools -dynamic -tags=zone=goettingen
psu create pgroup wuppertal-pools  -dynamic -tags=zone=wuppertal

# ---------------------------------------------------------------------------
# Links
#
# Write: PoolMonitorV5 zone-filters candidate pools to those matching the
#        door's zone, so all sites are covered by one link.
# Read:  same zone filtering applies; falls back cross-site if the file
#        is not found in the local zone.
# ---------------------------------------------------------------------------

psu create link write-link world-net any-store any-protocol
psu set link write-link -writepref=20 -readpref=0 -cachepref=0 -p2ppref=0
psu addto link write-link desy-pools
psu addto link write-link goettingen-pools
psu addto link write-link wuppertal-pools

psu create link read-link world-net any-store any-protocol
psu set link read-link -writepref=0 -readpref=20 -cachepref=20 -p2ppref=20
psu addto link read-link desy-pools
psu addto link read-link goettingen-pools
psu addto link read-link wuppertal-pools
