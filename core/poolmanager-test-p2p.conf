# only for testing p2p behaviour

# units
psu create unit -net 0.0.0.0/0.0.0.0
psu create unit -protocol */*
psu create unit -store *@*

# unit groups
psu create ugroup all-net
psu addto ugroup all-net 0.0.0.0/0.0.0.0
psu create ugroup any-protocol
psu addto ugroup any-protocol */*
psu create ugroup any-store
psu addto ugroup any-store *@*

# pool groups (pools join dynamically by their zone tag)
psu create pgroup main-pools -dynamic -tags=zone=main
psu create pgroup remote-pools -dynamic -tags=zone=remote

# main-pools: write destination + P2P source (cachepref=10)
psu create link main-link all-net any-protocol any-store
psu set link main-link -writepref=10 -readpref=5 -cachepref=10 -p2ppref=0
psu addto link main-link main-pools

# remote-pools: preferred read target + P2P destination (p2ppref=10)
psu create link remote-link all-net any-protocol any-store
psu set link remote-link -writepref=0 -readpref=10 -cachepref=0 -p2ppref=10
psu addto link remote-link remote-pools