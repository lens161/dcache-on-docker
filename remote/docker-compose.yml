services:

  dcache-pool:
    image: dcache/dcache:latest
    pull_policy: never
    hostname: remote-1
    networks:
      dcache:
        ipv4_address: 172.18.0.10
      remote-net:
        ipv4_address: 10.2.0.10
    ports:
      - "8180:8180"
      - "5007:5007"
      # - "2149:2049"
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
    volumes:
      - ../common/dcache.conf:/opt/dcache/etc/dcache.conf
      - ./exports:/opt/dcache/etc/exports
      - ./docker-layout.conf:/opt/dcache/etc/layouts/docker-layout.conf
      - ./data:/pool
      - ./certs/hostkey.pem:/etc/grid-security/hostkey.pem
      - ./certs/hostcert.pem:/etc/grid-security/hostcert.pem
      - ../common/certs/certificates:/etc/grid-security/certificates

networks:
  dcache:
    external: true
    name: dcache
  remote-net:
    name: remote-net
    ipam:
      config:
        - subnet: 10.2.0.0/24