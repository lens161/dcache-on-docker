services:

  dcache-pool:
    image: dcache/dcache:latest
    pull_policy: never
    hostname: main-1
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
    networks:
      - dcache
    ports:
      - "5006:5006"
    volumes:
      - ../common/dcache.conf:/opt/dcache/etc/dcache.conf
      - ./docker-layout.conf:/opt/dcache/etc/layouts/docker-layout.conf
      - ./data:/pool

networks:
  dcache:
    external: true
    name: dcache
